name: Verify Python package and documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install ".[test]"
      - run: python -m compileall -q python/spincirc
      - run: python -m pytest python/tests -q
      # Coverage reports only the maintained data-processing package; no unsupported threshold is claimed.
      - run: python -m pytest python/tests -q --cov=spincirc.analysis --cov-report=term-missing
      - run: python -m build
      - run: python -m venv /tmp/spincirc-smoke
      - run: /tmp/spincirc-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/spincirc-smoke/bin/spincirc-process --help
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -W -b html docs docs/_build/html
