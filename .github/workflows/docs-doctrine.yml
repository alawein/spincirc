name: Docs Doctrine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctrine:
    uses: alawein/alawein/.github/workflows/doctrine-reusable.yml@9287a0ca8fa218c9331e24c59f6844e9c7cc9a32
    with:
      strict: "true"
